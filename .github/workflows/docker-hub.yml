name: Docker Hub

# Only a pushed version tag publishes. Credentials live in the "dockerhub" environment, which only accepts v* tags.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: syncloom-homepage
    needs: test
    runs-on: ubuntu-latest
    environment: dockerhub
    env:
      NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Determine tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          # a SemVer pre-release carries a hyphen (0.2.0-rc1) and moves beta-latest, not latest
          if [[ "$version" == *-* ]]; then moving=beta-latest; else moving=latest; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "moving=$moving" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.NAMESPACE }}/syncloom-homepage:${{ steps.tags.outputs.version }}
            ${{ env.NAMESPACE }}/syncloom-homepage:${{ steps.tags.outputs.moving }}
          cache-from: type=gha,scope=syncloom-homepage
          cache-to: type=gha,mode=max,scope=syncloom-homepage
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.NAMESPACE }}/syncloom-homepage
          short-description: "The Syncloom website (Hugo, served by nginx)"
          readme-filepath: ./docker/syncloom-homepage.md
