- q: "Can the server operator read my files?"
  a: "No. File contents, file names and key/value data are encrypted on your device with keys derived from your password. The server only sees ciphertext, sizes and timestamps. That is also why the server cannot offer full-text search or previews."
- q: "What happens if I forget my password?"
  a: "You use your recovery key, which you were shown once at sign-up. Without the password and the recovery key your data cannot be decrypted, by design. Nobody, including an administrator, can reset it for you."
- q: "Do I have to use two-step sign-in?"
  a: "With built-in accounts, yes. You can enrol authenticator apps and hardware security keys, as many as you like. If you sign in through your own OpenID Connect provider, that provider enforces multi-factor authentication."
- q: "How does Syncloom handle conflicts?"
  a: "Concurrent edits to plain-text files are merged automatically when they touch different parts of the file. Anything else keeps both versions: the server's copy keeps the name and yours becomes “name (conflict – device – date)”. If one device edits a file another one deleted, the edit wins."
- q: "Where is my data stored?"
  a: "On your own server: metadata in PostgreSQL and encrypted chunks on a local volume or an S3-compatible bucket. There is no Syncloom cloud involved unless you choose to run one."
- q: "How is it licensed?"
  a: "Syncloom is open source under the Apache License 2.0. All repositories are in the Syncloom organisation on GitHub."
