- icon: "lock"
  title: "Encrypted before it leaves your device"
  text: "Names, contents, metadata and key/value data are sealed with XChaCha20-Poly1305 on your device. The server stores ciphertext and nothing else."
- icon: "merge"
  title: "Conflicts that resolve themselves"
  text: "Edit the same text file on two devices and Syncloom merges both changes. When it cannot, nothing is overwritten: you get a clearly named conflict copy."
- icon: "device"
  title: "Native on every platform"
  text: "SwiftUI on Mac and iPhone, GTK on Linux, WinUI on Windows, Material You on Android, and a fast web app. Each one feels like it belongs."
- icon: "history"
  title: "Versions and a safety net"
  text: "Every save is a version. Restore yesterday's draft, undelete a folder, and let retention rules tidy up on your schedule."
- icon: "share"
  title: "Sharing without trust"
  text: "Share with people or create public links. Keys are wrapped for each recipient, and link keys live in the URL fragment so the server never sees them."
- icon: "fingerprint"
  title: "Two-step sign-in, your way"
  text: "Add as many authenticator apps and hardware security keys as you like. Any one of them signs you in, so a lost key is an inconvenience, not a lockout."
- icon: "db"
  title: "Key/value storage built in"
  text: "A small, encrypted key/value store with compare-and-set and live change notifications, for settings, state and app data."
- icon: "bolt"
  title: "Live, not polling"
  text: "A streaming change feed pushes updates the moment they happen. Open a file on your laptop and it is already on your phone."
- icon: "server"
  title: "Yours to host"
  text: "One docker compose file brings up the server, the web app, Postgres and automatic HTTPS. Bring your own storage, or use any S3-compatible bucket."
- icon: "key"
  title: "Single sign-on ready"
  text: "Use your OpenID Connect provider for sign-in. Your files still get their own vault passphrase, so your identity provider never holds the keys."
- icon: terminal
  title: "A real command line"
  text: "Script it, run it on a headless server, or keep a folder in sync from cron. The CLI does everything the apps do, from sharing to key/value."
- icon: users
  title: "Built for small teams"
  text: "Invite people by code, set quotas, reset a lost second factor and tune retention from a clean admin page. No tickets, no surprises."
